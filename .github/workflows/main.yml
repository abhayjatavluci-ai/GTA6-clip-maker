name: Build GTA 6 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract project ZIP
        run: |
          echo "Files in repo:"
          ls -la
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Repo me koi .zip file nahi mili. ZIP ko main branch me upload karo."
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          unzip -o "$ZIP" -d source
          echo "Extracted structure:"
          find source -maxdepth 3 -not -path "*/__MACOSX/*" | head -50

      - name: Find Gradle project folder
        run: |
          SETTINGS=$(find source -name "settings.gradle*" -not -path "*/__MACOSX/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP ke andar settings.gradle ya settings.gradle.kts nahi mili."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Gradle project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            echo "Using project's gradlew"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "gradlew not found, using installed Gradle"
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Clip-Maker-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
